[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmstockmarket"
version = "21.3.0"
description = "A股市场分析工具 - Tushare + AKShare 数据源, FastAPI + ECharts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ATMstockMarket Team"}
]
keywords = ["stock", "market", "analysis", "tushare", "akshare", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "tushare>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "akshare>=1.16.0",
    "pypinyin>=0.51.0",
    "requests>=2.31.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/superherocheng/ATMstockMarketSimple"
Documentation = "https://github.com/superherocheng/ATMstockMarketSimple#readme"
Repository = "https://github.com/superherocheng/ATMstockMarketSimple.git"

[project.scripts]
atm-web = "src.web.app:main"
atm-fetch = "src.data_fetchers.tushare_fetcher:main"

[tool.setuptools]
packages = ["src", "src.core", "src.data_fetchers", "src.web", "config"]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
