    <script>
    document.addEventListener('DOMContentLoaded', function() {
    try {
    async function loadDataRange() {
        try {
            var resp = await fetch('/api/data-range');
            if (!resp.ok) {
                throw new Error('HTTP ' + resp.status);
            }
            var info = await resp.json();
            renderDataStatus(info);
        } catch(e) {
            document.getElementById('data-status').innerHTML = '<div class="error-message"><div class="error-message-content"><div class="error-message-title">数据加载失败</div><div class="error-message-detail">' + e.message + '</div></div></div>';
        }
    }

    function renderDataStatus(info) {
        var rows = [
            { group: 'ETF数据', items: ['index_etf_daily','sector_etf_daily','etf_share'] },
        ];
        var anyNeedUpdate = false;
        var html = '<div class="overflow-x-auto" style="-webkit-overflow-scrolling:touch;overflow-x:auto;"><table class="w-full text-sm zebra-table" style="min-width:520px;">';
        html += '<thead><tr><th class="px-3 py-2 text-left whitespace-nowrap">数据类型</th><th class="px-3 py-2 text-left whitespace-nowrap">数据表</th><th class="px-3 py-2 text-center whitespace-nowrap">记录数</th><th class="px-3 py-2 text-left hidden sm:table-cell whitespace-nowrap">日期范围</th><th class="px-3 py-2 text-center whitespace-nowrap">状态</th></tr></thead><tbody>';

        rows.forEach(function(section) {
            section.items.forEach(function(key) {
                var d = info[key];
                if (!d) return;
                var st = ATM.dataStatus(d);
                if (st.need) anyNeedUpdate = true;
                var cnt = d.count > 0 ? d.count.toLocaleString() : '-';
                var range = (d.min_date && d.max_date) ? ATM.fmtDate(d.min_date) + ' ~ ' + ATM.fmtDate(d.max_date) : '-';
                html += '<tr>';
                html += '<td class="px-3 py-2 align-middle"><span class="font-semibold">' + section.group + '</span></td>';
                html += '<td class="px-3 py-2 align-middle" style="color:var(--c-text-secondary);">' + d.display_name + '</td>';
                html += '<td class="px-3 py-2 text-center align-middle font-mono" style="color:var(--c-text);">' + cnt + '</td>';
                html += '<td class="px-3 py-2 text-xs font-mono hidden sm:table-cell align-middle" style="color:var(--c-text-tertiary);">' + range + '</td>';
                html += '<td class="px-3 py-2 text-center align-middle"><span class="inline-flex items-center gap-1.5 text-xs font-medium px-2 py-1 rounded-full" style="background:' + st.color + '15;color:' + st.color + '"><span class="w-1.5 h-1.5 rounded-full" style="background:' + st.color + ';"></span>' + st.tag + '</span></td>';
                html += '</tr>';
            });
        });

        html += '</tbody></table></div>';
        document.getElementById('data-status').innerHTML = html;

        var btn = document.getElementById('btn-update');
        if (btn && !btn.disabled) {
            if (Object.values(info).every(function(d) { return !d.exists || d.count === 0; })) {
                btn.innerHTML = '首次获取ETF数据';
            } else if (anyNeedUpdate) {
                btn.innerHTML = '一键更新+回测';
            } else {
                btn.innerHTML = '数据已是最新';
            }
        }
    }

    async function oneClickUpdate() {
        disableAllButtons();
        setButtonLoading('btn-update', '启动中...');
        try {
            var resp = await fetch('/api/fetch/all', { method: 'POST' });
            if (resp.status === 409) {
                setButtonLoading('btn-update', '获取中...');
                document.getElementById('fetch-progress').classList.remove('hidden');
                if (!pollTimer) { pollTimer = setInterval(pollStatus, 1500); pollStatus(); }
                return;
            }
            document.getElementById('fetch-progress').classList.remove('hidden');
            document.getElementById('fetch-log').innerHTML = '<div style="color:#D97706;">正在启动全量数据获取 + 回测...</div>';
            updateProgressBar(0, 'running');
            document.getElementById('fetch-status-text').textContent = '数据获取中...';
            setButtonLoading('btn-update', '获取中...');
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollStatus, 1500);
            setTimeout(pollStatus, 800);
        } catch(e) {
            alert('启动失败: ' + e.message);
            enableAllButtons();
            resetButtonAll();
        }
    }

    function updateProgressBar(pct, state) {
        var fill = document.getElementById('progress-fill');
        fill.style.width = Math.max(pct, 2) + '%';
        fill.className = 'progress-bar-fill ' + state;
    }

    function disableAllButtons() {
        document.getElementById("btn-update").disabled = true;
    }

    function enableAllButtons() {
        document.getElementById("btn-update").disabled = false;
    }

    function setButtonLoading(btnId, text) {
        var btn = document.getElementById(btnId);
        btn.innerHTML = '<span class="spinner spinner-sm"></span> ' + text;
    }

    function resetButtonAll() { document.getElementById("btn-update").innerHTML = '一键更新+回测'; }

    async function updateShareStatus() {
        try {
            var resp = await fetch("/api/etf-share/status");
            var status = await resp.json();
            var el = document.getElementById("share-status");
            if (!el) return;
            if (status.error) {
                el.innerHTML = '<span class="status-dot status-dot-error"></span> 份额: 获取失败';
                return;
            }
            var fresh = status.summary ? status.summary.fresh : 0;
            var total = status.summary ? status.summary.total : 0;
            var pct = total > 0 ? (fresh / total * 100) : 0;
            var colorClass = pct >= 100 ? 'status-dot-ok' : (fresh > 0 ? 'status-dot-warn' : 'status-dot-error');
            var label = pct >= 100 ? '完整' : (fresh + '/' + total);
            var freshnessNote = '';
            if (status.latest_trading_date) {
                var d = String(status.latest_trading_date);
                var lastDate = new Date(parseInt(d.slice(0,4)), parseInt(d.slice(4,6))-1, parseInt(d.slice(6,8)));
                var today = new Date();
                var daysAgo = Math.round((today - lastDate) / (1000*60*60*24));
                if (daysAgo > 0) freshnessNote = ' (' + daysAgo + '天前)';
            }
            el.innerHTML = '<span class="status-dot ' + colorClass + '"></span> 份额: ' + label + freshnessNote;
        } catch(e) {
            var el = document.getElementById("share-status");
            if (el) el.innerHTML = '<span class="status-dot status-dot-error"></span> 份额: 错误';
        }
    }
    
    function fmtDateDisplay(dateStr) {
        if (!dateStr) return "-";
        return dateStr.substring(0, 4) + "-" + dateStr.substring(4, 6) + "-" + dateStr.substring(6, 8);
    }

    var pollTimer = null;

    function isBacktestStep(step) {
        return step && (step.indexOf('因子') >= 0 || step.indexOf('IC') >= 0 || step.indexOf('回测') >= 0);
    }

    async function pollStatus() {
        try {
            var resp = await fetch('/api/fetch/status');
            var st = await resp.json();
            var logEl = document.getElementById('fetch-log');
            logEl.innerHTML = st.log.map(function(line) {
                if (line.startsWith('[ERROR]') || line.startsWith('[ERR')) return '<div style="color:var(--c-up);">' + line + '</div>';
                if (line.startsWith('[OK]') || line.startsWith('[DONE]')) return '<div style="color:var(--c-down);font-weight:600;">' + line + '</div>';
                if (line.startsWith('=')) return '<div style="color:#5a6f5a;font-weight:700;">' + line + '</div>';
                if (line.startsWith('$')) return '<div style="color:#D97706;">' + line + '</div>';
                return '<div style="color:var(--c-text-secondary);">' + line + '</div>';
            }).join('');
            logEl.scrollTop = logEl.scrollHeight;
            document.getElementById('fetch-current-step').textContent = st.current_step || '';
            if (st.running) {
                updateProgressBar(st.progress || 0, 'running');
                if (isBacktestStep(st.current_step)) {
                    document.getElementById('fetch-status-text').textContent = '回测中...';
                } else {
                    document.getElementById('fetch-status-text').textContent = '获取数据中...';
                }
            } else if (st.finished_at) {
                var hasError = st.log.some(function(l) { return l.startsWith('[ERROR]'); });
                if (st.backtest_done) {
                    updateProgressBar(100, 'done');
                    document.getElementById('fetch-status-text').textContent = '数据更新 + 回测完成 ✓';
                    document.getElementById('backtest-done-bar').classList.remove('hidden');
                } else {
                    updateProgressBar(hasError ? st.progress : 100, hasError ? 'error' : 'done');
                    document.getElementById('fetch-status-text').textContent = hasError ? '部分出错' : '已完成';
                }
                document.getElementById('fetch-status-text').style.color = 'var(--c-down)';
                if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
                enableAllButtons();
                resetButtonAll();
                loadDataRange();
                loadOverview();
            }
        } catch(e) { console.error('轮询失败:', e); }
    }

    async function loadFetchStatus() {
        try {
            var resp = await fetch('/api/fetch/status');
            var st = await resp.json();
            if (st.running) {
                document.getElementById('fetch-progress').classList.remove('hidden');
                disableAllButtons();
                if (!pollTimer) { pollTimer = setInterval(pollStatus, 1500); }
                pollStatus();
            } else if (st.finished_at && st.backtest_done) {
                // Show completed backtest bar if page refreshed after completion
                document.getElementById('backtest-done-bar').classList.remove('hidden');
            }
        } catch(e) {}
    }

    async function loadIcSummary() {
        try {
            var resp = await fetch('/api/analysis/ic-summary-all');
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            var data = await resp.json();
            renderIcSummary(data);
        } catch(e) { console.warn('IC概览加载失败:', e.message); }
    }

    function renderIcSummary(data) {
        var el = document.getElementById('ic-summary-table');
        if (!data || !data.presets || data.presets.length === 0) {
            el.innerHTML = '<div class="empty-state"><div class="empty-state-title">暂无数据</div><div class="empty-state-detail">运行「一键更新+回测」后生成</div></div>';
            return;
        }
        var html = '<table class="w-full text-sm zebra-table" style="min-width:580px;">';
        html += '<thead><tr>' +
            '<th class="px-3 py-2 text-left whitespace-nowrap">预设</th>' +
            '<th class="px-3 py-2 text-center whitespace-nowrap">H</th>' +
            '<th class="px-3 py-2 text-center whitespace-nowrap">IC均值</th>' +
            '<th class="px-3 py-2 text-center whitespace-nowrap hidden sm:table-cell">IC标准差</th>' +
            '<th class="px-3 py-2 text-center whitespace-nowrap">ICIR</th>' +
            '<th class="px-3 py-2 text-center whitespace-nowrap hidden sm:table-cell">胜率</th>' +
            '<th class="px-3 py-2 text-center whitespace-nowrap hidden sm:table-cell">样本</th>' +
            '</tr></thead><tbody>';

        data.presets.forEach(function(p) {
            var icMean = p.ic_mean !== null ? p.ic_mean.toFixed(4) : '--';
            var icStd = p.ic_std !== null ? p.ic_std.toFixed(4) : '--';
            var icir = p.icir !== null ? p.icir.toFixed(4) : '--';
            var winRate = p.ic_win_rate !== null ? p.ic_win_rate.toFixed(2) + '%' : '--';
            var samples = p.sample_count || '--';

            // Color coding
            var meanColor = p.ic_mean !== null ? (Math.abs(p.ic_mean) > 0.03 ? 'var(--c-up)' : 'var(--c-text)') : '';
            var icirColor = p.icir !== null ? (Math.abs(p.icir) > 0.3 ? 'var(--c-up)' : Math.abs(p.icir) > 0.15 ? '#D97706' : 'var(--c-text)') : '';
            var winColor = p.ic_win_rate !== null ? (p.ic_win_rate > 60 ? 'var(--c-up)' : p.ic_win_rate > 50 ? '#D97706' : 'var(--c-text)') : '';

            var labelSuffix = p.preset_id === 'rsrs_aggressive'
                ? ' <span class="tech-tag tag-amber" style="font-size:10px;padding:1px 5px;">实验</span>'
                : ' <span class="tech-tag tag-green" style="font-size:10px;padding:1px 5px;">标准</span>';

            html += '<tr>' +
                '<td class="px-3 py-2 align-middle"><span class="font-semibold">' + p.label + '</span>' + labelSuffix + '</td>' +
                '<td class="px-3 py-2 text-center align-middle font-mono text-xs" style="color:var(--c-text-tertiary);">' + p.forward_days + '</td>' +
                '<td class="px-3 py-2 text-center align-middle font-mono" style="color:' + meanColor + ';">' + icMean + '</td>' +
                '<td class="px-3 py-2 text-center align-middle font-mono hidden sm:table-cell" style="color:var(--c-text-tertiary);">' + icStd + '</td>' +
                '<td class="px-3 py-2 text-center align-middle font-mono" style="color:' + icirColor + ';">' + icir + '</td>' +
                '<td class="px-3 py-2 text-center align-middle font-mono hidden sm:table-cell" style="color:' + winColor + ';">' + winRate + '</td>' +
                '<td class="px-3 py-2 text-center align-middle font-mono hidden sm:table-cell" style="color:var(--c-text-tertiary);">' + samples + '</td>' +
                '</tr>';
        });

        html += '</tbody></table>';
        html += '<div class="mt-3 text-xs flex flex-wrap gap-3" style="color:var(--c-text-tertiary);">' +
            '<span><span class="tech-tag tag-green" style="font-size:10px;">标准</span> 三周期标准参数</span>' +
            '<span><span class="tech-tag tag-amber" style="font-size:10px;">实验</span> RSRS主导权重</span>' +
            '</div>';
        el.innerHTML = html;
    }

    async function loadMarketTiming() {
        try {
            var resp = await fetch('/api/market-timing');
            if (!resp.ok) return;
            var d = await resp.json();
            if (d.error) return;
            renderMarketBanner(d);
            renderMarketMiniCard(d);
        } catch(e) { console.warn('大盘择时加载失败:', e.message); }
    }

    function renderMarketBanner(d) {
        var el = document.getElementById('market-banner');
        if (!el) return;
        var adj = (d.adjustment || 0) * 100;
        var sign = adj > 0 ? '+' : '';
        var sc = adj > 0 ? 'var(--c-up)' : (adj < 0 ? 'var(--c-down)' : 'var(--c-text-tertiary)');
        el.innerHTML = '<div style="display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);">' +
            '<span class="home-card-bar up" style="height:24px;"></span>' +
            '<div><div style="font-weight:600;font-size:var(--text-sm);">大盘择时: <span style="color:' + sc + ';">' + (d.regime_cn || '中性') + '</span></div>' +
            '<div style="font-size:var(--text-xs);color:var(--c-text-tertiary);">' + (d.narrative || '暂无信号') + '</div></div>' +
            '<div style="margin-left:auto;text-align:right;"><div style="font-weight:700;font-size:var(--text-lg);font-family:var(--font-mono);color:' + sc + ';">' + sign + adj.toFixed(1) + '%</div>' +
            '<div style="font-size:10px;color:var(--c-text-tertiary);">仓位调整</div></div></div>';
    }

    function renderMarketMiniCard(d) {
        // mini-card no longer used; data only shown in top banner
    }

    async function loadOverview() {
        loadDataRange();
        loadFetchStatus();
        updateShareStatus();
        loadIcSummary();
        loadMarketTiming();
        try {
            var resp = await fetch('/api/overview');
            if (!resp.ok) {
                throw new Error('HTTP ' + resp.status);
            }
            var data = await resp.json();
            renderHeatmap(data.sector_summary);
        } catch(e) { console.warn('概览数据加载失败:', e.message); }
    }

    function renderHeatmap(sectors) {
        var c = document.getElementById('heatmap');
        if (!sectors || sectors.length === 0) {
            c.innerHTML = '<div class="col-span-2 sm:col-span-5 empty-state"><div class="empty-state-title">暂无板块数据</div></div>';
            return;
        }
        var sortedSectors = sectors.slice().sort(function(a, b) {
            return parseFloat(b.pct_chg || 0) - parseFloat(a.pct_chg || 0);
        });
        c.innerHTML = sortedSectors.map(function(s) {
            var pct = parseFloat(s.pct_chg || 0);
            var intensity = Math.min(Math.abs(pct) / 3, 1);
            var bg = pct > 0 ? 'rgba(212, 114, 106, ' + (0.08 + intensity * 0.12) + ')'
                    : pct < 0 ? 'rgba(106, 175, 124, ' + (0.08 + intensity * 0.12) + ')'
                    : 'var(--c-bg-tertiary)';
            return '<div class="heat-cell rounded-lg p-2 sm:p-4 cursor-pointer" style="background:' + bg + '" onclick="location.href=\'/sector?code=' + s.ts_code + '\'" title="' + s.name + ': ' + ATM.pctText(pct) + '">' +
                '<div class="font-medium text-xs sm:text-sm mb-0.5 sm:mb-1">' + s.name + '</div>' +
                '<div class="text-base sm:text-lg font-bold font-mono" style="color:' + ATM.pctColor(pct) + '">' + ATM.pctText(pct) + '</div></div>';
        }).join('');
    }

    ATMPerf.VisibilityManager.register(
        function() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } },
        function() { loadOverview(); }
    );

    loadOverview();
    window.__atmPageReady();
    
    // Expose handler functions for inline onclick attributes
    window.oneClickUpdate = oneClickUpdate;
    } catch(e) { console.error('Page init error:', e);
        document.getElementById('data-status').innerHTML = '<div class="error-message"><div class="error-message-title">页面加载错误</div><div class="error-message-detail">' + e.message + '</div></div>';
    }
    });
    </script>
</body>
</html>
