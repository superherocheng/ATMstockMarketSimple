    <script>
    document.addEventListener('DOMContentLoaded', function() {
    try {

    var currentCode = '510300.SH';
    var klineChart = null;
    var shareDetailChart = null;
    var _dateRangeDays = 60;

    function setDateRange(btn, days) {
        document.querySelectorAll('.range-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        _dateRangeDays = days;
        if (window._etfCachedData) renderKline(window._etfCachedData);
    }

    function switchETF(btn) {
        document.querySelectorAll('.tab-btn').forEach(function(b) {
            b.classList.remove('active');
        });
        btn.classList.add('active');
        currentCode = btn.dataset.code;
        loadData(currentCode);
    }

    async function loadData(code) {
        try {
            var resp = await fetch('/api/index-etf/' + code);
            var data = await resp.json();
            updateInfo(data);
            try { await ATMChart.load(); } catch(e) { console.warn('ECharts load failed:', e); }
            window._etfCachedData = data;
            renderKline(data);
            renderShareDetail(data);
            renderAnomalies(data);
            loadShareStd(code);
        } catch(e) {
            console.error('加载失败:', e);
        }
    }

    async function loadShareStd(code) {
        try {
            var resp = await fetch('/api/share-std/' + code);
            var data = await resp.json();
            renderShareStd(data);
        } catch(e) {
            console.error('加载份额标准差失败:', e);
            document.getElementById('share-std-card').innerHTML = '<div style="color:var(--c-text-tertiary);">加载失败</div>';
        }
    }

    function updateInfo(data) {
        document.getElementById('etf-name').textContent = data.name;
        document.getElementById('etf-code').textContent = currentCode;
        var kline = data.kline;
        if (kline && kline.length > 0) {
            var last = kline[kline.length - 1];
            document.getElementById('etf-price').textContent = ATM.formatNum(last.close);
            var pct = parseFloat(last.pct_chg || 0);
            var pctEl = document.getElementById('etf-pct');
            pctEl.textContent = ATM.pctText(pct);
            pctEl.style.color = ATM.pctColor(pct);
            document.getElementById('etf-vol').textContent = ATM.formatNum((parseFloat(last.amount || 0) / 10000).toFixed(0), 0) + '万';
        } else {
            document.getElementById('etf-price').textContent = '--';
            document.getElementById('etf-pct').textContent = '--';
            document.getElementById('etf-pct').style.color = '';
            document.getElementById('etf-vol').textContent = '--';
        }
    }

    function renderKline(data) {
        var el = document.getElementById('kline-chart');
        if (klineChart && !klineChart.isDisposed()) klineChart.dispose();
        el.innerHTML = '';
        var kline = data.kline || [];
        /* apply date range filter */
        if (_dateRangeDays > 0 && kline.length > _dateRangeDays) {
            kline = kline.slice(-_dateRangeDays);
        }
        if (kline.length === 0) {
            el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--c-text-tertiary);">暂无K线数据</div>';
            return;
        }
        klineChart = echarts.init(el);

        var th = ATM.getChartTheme();
        var dates = kline.map(function(k) { return k.trade_date; });
        var ohlc = kline.map(function(k) { return [parseFloat(k.open||0), parseFloat(k.close||0), parseFloat(k.low||0), parseFloat(k.high||0)]; });
        var volumes = kline.map(function(k) { return parseFloat(k.vol || 0); });
        var pcts = kline.map(function(k) { return parseFloat(k.pct_chg || 0); });

        var sortedVols = volumes.slice().sort(function(a, b) { return a - b; });
        var volPercentiles = volumes.map(function(v) {
            if (sortedVols.length === 0) return 0;
            var rank = sortedVols.filter(function(x) { return x <= v; }).length;
            return Math.round(rank / sortedVols.length * 100);
        });

        var anomalyDates = new Set((data.anomalies && data.anomalies.price || []).map(function(a) { return a.trade_date; }));
        var markPoints = kline.filter(function(k) { return anomalyDates.has(k.trade_date); }).map(function(k) {
            return {
                name: k.trade_date + ' ' + ATM.pctText(k.pct_chg),
                coord: [k.trade_date, parseFloat(k.high || 0)],
                symbolSize: 8,
                itemStyle: { color: th.upColor }
            };
        });

        klineChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            title: {
                text: 'K线走势',
                left: '3%',
                top: '2%',
                textStyle: {
                    color: '#1A1C19',
                    fontWeight: 600,
                    fontSize: 14,
                    fontFamily: "-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"
                }
            },
            tooltip: {
                backgroundColor: th.tooltip.backgroundColor,
                borderColor: th.tooltip.borderColor,
                textStyle: th.tooltip.textStyle,
                formatter: function(params) {
                    var result = '<b>' + params[0].axisValue + '</b><br/>';
                    params.forEach(function(p) {
                        var val = p.value;
                        if (Array.isArray(val)) {
                            result += p.marker + ' 开盘: ' + val[1].toFixed(2) + ', 收盘: ' + val[2].toFixed(2) + ', 最低: ' + val[3].toFixed(2) + ', 最高: ' + val[4].toFixed(2) + '<br/>';
                        } else {
                            result += p.marker + ' ' + p.seriesName + ': ' + val + '%<br/>';
                        }
                    });
                    return result;
                }
            },
            legend: { 
                data: ['K线', '成交量百分位'], 
                textStyle: th.legend.textStyle,
                top: '2%',
                right: '3%',
                align: 'right'
            },
            grid: [
                { left: '8%', right: '3%', top: '12%', height: '50%' },
                { left: '8%', right: '3%', top: '68%', height: '20%' }
            ],
            xAxis: [
                { type: 'category', data: dates, gridIndex: 0, axisLabel: { color: th.axisLabelColor, fontSize: 10 }, boundaryGap: true },
                { type: 'category', data: dates, gridIndex: 1, axisLabel: { show: false }, boundaryGap: true }
            ],
            yAxis: [
                { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: th.splitLineColor } }, axisLabel: { color: th.axisLabelColor } },
                { scale: true, gridIndex: 1, splitLine: { show: false }, axisLabel: { color: th.axisLabelColor, formatter: '{value}%' }, min: 0, max: 100 }
            ],
            dataZoom: [
                { type: 'inside', xAxisIndex: [0, 1], start: 60, end: 100 },
                { show: true, xAxisIndex: [0, 1], type: 'slider', bottom: '2%', start: 60, end: 100 }
            ],
            series: [
                {
                    name: 'K线', type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0,
                    itemStyle: { color: th.upColor, color0: th.downColor, borderColor: th.upColor, borderColor0: th.downColor },
                    markPoint: { data: markPoints, symbol: 'pin', symbolSize: 30, label: { show: false } }
                },
                {
                    name: '成交量百分位', type: 'bar',
                    data: volPercentiles.map(function(pct, i) {
                        return {
                            value: pct,
                            itemStyle: { color: pcts[i] >= 0 ? th.upColor + '66' : th.downColor + '66' }
                        };
                    }),
                    xAxisIndex: 1, yAxisIndex: 1,
                    label: { show: true, position: 'top', color: th.axisLabelColor, fontSize: 8, formatter: '{c}%' }
                }
            ]
        }, true);
    }

    // 份额实际值图表：过去120天折线(绝对值) + 每日变化ZSCORE柱状
    function renderShareDetail(data) {
        var el = document.getElementById('share-value-chart');
        if (shareDetailChart && !shareDetailChart.isDisposed()) shareDetailChart.dispose();
        el.innerHTML = '';
        if (typeof echarts === 'undefined') { console.warn('echarts not available'); return; }
        shareDetailChart = echarts.init(el);
        var th = ATM.getChartTheme();

        var shares = (data.shares || []).slice();
        if (shares.length === 0) {
            shareDetailChart.setOption({
                backgroundColor: 'transparent',
                title: { text: '暂无份额数据', left: 'center', top: 'center', textStyle: { color: th.axisLabelColor, fontSize: 14, fontWeight: 'normal' } }
            }, true);
            return;
        }

        // 取过去120天数据
        var chartData = shares.slice(-120);
        var dates = chartData.map(function(sh) {
            var d = sh.trade_date;
            return d ? d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8) : d;
        });
        var values = chartData.map(function(sh) { return parseFloat(sh.fd_share || 0); });

        var dailyChanges = [];
        var pctChanges = [];
        for (var i = 0; i < values.length; i++) {
            if (i === 0) {
                dailyChanges.push(null);
                pctChanges.push(null);
            } else {
                dailyChanges.push(values[i] - values[i-1]);
                if (values[i-1] > 0) {
                    pctChanges.push((values[i] - values[i-1]) / values[i-1] * 100);
                } else {
                    pctChanges.push(0);
                }
            }
        }

        var validPctChanges = pctChanges.filter(function(v) { return v !== null; });
        var pctMean = validPctChanges.reduce(function(a, b) { return a + b; }, 0) / validPctChanges.length;
        var pctVariance = validPctChanges.reduce(function(a, b) { return a + Math.pow(b - pctMean, 2); }, 0) / validPctChanges.length;
        var pctStd = Math.sqrt(pctVariance) || 1;

        var zscores = pctChanges.map(function(v) {
            return v === null ? null : (v - pctMean) / pctStd;
        });

        shareDetailChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            tooltip: {
                trigger: 'axis',
                backgroundColor: th.tooltip.backgroundColor,
                borderColor: th.tooltip.borderColor,
                textStyle: th.tooltip.textStyle,
                formatter: function(params) {
                    var tip = '<b>' + params[0].axisValueLabel + '</b><br/>';
                    params.forEach(function(p) {
                        if (p.value === null || p.value === undefined) return;
                        if (p.seriesName.indexOf('ZSCORE') !== -1) {
                            var zv = p.value;
                            var zcolor = zv > 0 ? th.upColor : zv < 0 ? th.downColor : '#888';
                            tip += p.marker + ' ' + p.seriesName + ': <span style="color:' + zcolor + ';font-weight:bold;">' + (zv > 0 ? '+' : '') + zv.toFixed(2) + 'σ</span><br/>';
                        } else {
                            tip += p.marker + ' ' + p.seriesName + ': ' + p.value.toFixed(2) + ' 亿份<br/>';
                        }
                    });
                    return tip;
                }
            },
            legend: {
                data: ['份额绝对值(120日)', '份额变化ZSCORE'],
                textStyle: th.legend.textStyle
            },
            grid: { left: '10%', right: '8%', top: '15%', bottom: '15%' },
            xAxis: {
                type: 'category',
                data: dates,
                axisLabel: { color: th.axisLabelColor, fontSize: 10, rotate: 30 },
                boundaryGap: true
            },
            yAxis: [
                {
                    type: 'value',
                    name: '亿份',
                    nameTextStyle: { color: th.axisLabelColor, fontSize: 10 },
                    axisLabel: { color: th.axisLabelColor, formatter: '{value}' },
                    splitLine: { lineStyle: { color: th.splitLineColor } }
                },
                {
                    type: 'value',
                    name: 'σ',
                    nameTextStyle: { color: th.axisLabelColor, fontSize: 10 },
                    axisLabel: { color: th.axisLabelColor, formatter: '{value}σ' },
                    splitLine: { show: false },
                    scale: true
                }
            ],
            dataZoom: [
                { type: 'inside', start: 0, end: 100 },
                { type: 'slider', start: 0, end: 100 }
            ],
            series: [
                {
                    name: '份额绝对值(120日)',
                    type: 'line',
                    yAxisIndex: 0,
                    data: values,
                    smooth: true,
                    showSymbol: false,
                    lineStyle: { width: 2, color: '#6B8F71' },
                    areaStyle: {
                        color: {
                            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: '#6B8F7144' },
                                { offset: 1, color: '#6B8F7108' }
                            ]
                        }
                    },
                    z: 1
                },
                {
                    name: '份额变化ZSCORE',
                    type: 'bar',
                    yAxisIndex: 1,
                    data: zscores.map(function(z) {
                        if (z === null) return { value: null };
                        return {
                            value: z,
                            itemStyle: {
                                color: z >= 0 ? th.upColor : th.downColor,
                                opacity: 0.7
                            }
                        };
                    }),
                    barMaxWidth: 12,
                    z: 2
                }
            ]
        }, true);
    }

    function renderAnomalies(data) {
        var shareEl = document.getElementById('share-anomalies');
        var shareAnom = (data.anomalies && data.anomalies.share) || [];

        if (shareAnom.length === 0) {
            shareEl.innerHTML = '<div style="color:var(--c-text-tertiary);">暂无份额异常事件</div>';
        } else {
            shareEl.innerHTML = shareAnom.slice(-10).reverse().map(function(a) {
                var chgPct = parseFloat(a.chg_pct || 0);
                var zScore = parseFloat(a.z_score || 0);
                var clr = chgPct >= 0 ? 'var(--c-up)' : 'var(--c-down)';
                var sign = chgPct >= 0 ? '+' : '';
                return '<div class="flex items-center justify-between glass rounded px-3 py-2">' +
                    '<span><span class="pulse-dot"></span> ' + a.trade_date + '</span>' +
                    '<div class="flex items-center gap-3">' +
                        '<span class="font-bold num-mono font-mono" style="color:' + clr + '">' + sign + chgPct.toFixed(2) + '%</span>' +
                        '<span class="text-xs num-mono font-mono px-1.5 py-0.5 rounded" style="background:var(--c-accent-bg);color:var(--c-accent);">' + zScore.toFixed(1) + 'σ</span>' +
                    '</div></div>';
            }).join('');
        }
    }

    function fmtDate(d) {
        if (!d) return '-';
        return d.substring(0,4) + '-' + d.substring(4,6) + '-' + d.substring(6,8);
    }

    function renderShareStd(data) {
        var el = document.getElementById('share-std-card');
        
        if (data.error) {
            el.innerHTML = '<div style="color:var(--c-text-tertiary);">数据不足</div>';
            return;
        }

        var stdDev = data.std_dev;
        var latestChange = data.latest_change;
        var zScore = data.z_score;
        var totalChange = data.total_change;
        var positiveDays = data.positive_days;
        var negativeDays = data.negative_days;

        var zScoreColor = '#888';
        var zScoreLabel = '正常';
        if (Math.abs(zScore) >= 2) {
            zScoreColor = zScore > 0 ? 'var(--c-up)' : 'var(--c-down)';
            zScoreLabel = zScore > 0 ? '显著增加' : '显著减少';
        } else if (Math.abs(zScore) >= 1) {
            zScoreColor = zScore > 0 ? '#10b981' : '#f59e0b';
            zScoreLabel = zScore > 0 ? '小幅增加' : '小幅减少';
        }

        var latestChangeColor = latestChange >= 0 ? 'var(--c-up)' : 'var(--c-down)';
        var totalChangeColor = totalChange >= 0 ? 'var(--c-up)' : 'var(--c-down)';
        
        var direction = latestChange >= 0 ? '↑ 流入' : '↓ 流出';
        var directionColor = latestChange >= 0 ? 'var(--c-up)' : 'var(--c-down)';

        var zScoreInterpretation = '';
        if (zScore > 1.5) {
            zScoreInterpretation = '变化显著偏大';
        } else if (zScore < -1.5) {
            zScoreInterpretation = '变化显著偏小';
        } else if (zScore > 0.5) {
            zScoreInterpretation = '变化偏大';
        } else if (zScore < -0.5) {
            zScoreInterpretation = '变化偏小';
        } else {
            zScoreInterpretation = '变化正常';
        }

        el.innerHTML = 
            '<div class="space-y-3">' +
                '<div class="flex items-center justify-between p-3 rounded" style="background:var(--c-accent-bg);">' +
                    '<div>' +
                        '<div class="text-xs" style="color:var(--c-text-tertiary);">标准差</div>' +
                        '<div class="text-lg font-bold num-mono font-mono">' + stdDev.toFixed(4) + '%</div>' +
                    '</div>' +
                    '<div class="text-right">' +
                        '<div class="text-xs" style="color:var(--c-text-tertiary);">最新变化</div>' +
                        '<div class="text-lg font-bold num-mono font-mono" style="color:' + latestChangeColor + '">' +
                            (latestChange >= 0 ? '+' : '') + latestChange.toFixed(4) + '%' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="p-3 rounded text-center" style="background:' + (latestChange >= 0 ? '#ecfdf5' : '#fef2f2') + ';">' +
                    '<div class="text-xs" style="color:var(--c-text-tertiary);">最新份额变化 <span class="font-mono">(' + fmtDate(data.latest_date) + ')</span></div>' +
                    '<div class="flex items-center justify-center gap-2 mt-1">' +
                        '<span class="text-2xl font-bold num-mono font-mono" style="color:' + directionColor + '">' +
                            (latestChange >= 0 ? '+' : '') + latestChange.toFixed(4) + '%' +
                        '</span>' +
                        '<span class="text-sm font-medium px-2 py-1 rounded" style="background:' + directionColor + '22;color:' + directionColor + ';">' +
                            direction +
                        '</span>' +
                    '</div>' +
                    '<div class="text-xs mt-2" style="color:var(--c-text-tertiary);">Z-Score: <span style="color:' + zScoreColor + ';font-weight:bold;">' + (zScore >= 0 ? '+' : '') + zScore.toFixed(2) + 'σ</span> (' + zScoreInterpretation + ')</div>' +
                '</div>' +
                '<div class="flex items-center justify-between p-3 rounded" style="background:#f9fafb;">' +
                    '<div>' +
                        '<div class="text-xs" style="color:var(--c-text-tertiary);">Z-Score</div>' +
                        '<div class="text-lg font-bold num-mono font-mono" style="color:' + zScoreColor + '">' +
                            (zScore >= 0 ? '+' : '') + zScore.toFixed(2) + 'σ' +
                        '</div>' +
                        '<div class="text-xs mt-1" style="color:' + zScoreColor + ';">' + zScoreInterpretation + '</div>' +
                    '</div>' +
                    '<div class="text-right">' +
                        '<div class="text-xs" style="color:var(--c-text-tertiary);">10日累计变化</div>' +
                        '<div class="text-lg font-bold num-mono font-mono" style="color:' + totalChangeColor + '">' +
                            (totalChange >= 0 ? '+' : '') + totalChange.toFixed(4) + '%' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="grid grid-cols-2 gap-2 text-xs">' +
                    '<div class="p-2 rounded" style="background:#ecfdf5;">' +
                        '<div style="color:#6b7280;">增加天数</div>' +
                        '<div class="font-bold" style="color:#059669;">' + positiveDays + ' 天</div>' +
                    '</div>' +
                    '<div class="p-2 rounded" style="background:#fef3c7;">' +
                        '<div style="color:#6b7280;">减少天数</div>' +
                        '<div class="font-bold" style="color:#d97706;">' + negativeDays + ' 天</div>' +
                    '</div>' +
                    '<div class="p-2 rounded" style="background:#f0f9ff;">' +
                        '<div style="color:#6b7280;">最大增幅</div>' +
                        '<div class="font-bold" style="color:#0284c7;">' + (data.max_change >= 0 ? '+' : '') + data.max_change.toFixed(4) + '%</div>' +
                    '</div>' +
                    '<div class="p-2 rounded" style="background:#fef2f2;">' +
                        '<div style="color:#6b7280;">最大降幅</div>' +
                        '<div class="font-bold" style="color:#dc2626;">' + (data.min_change >= 0 ? '+' : '') + data.min_change.toFixed(4) + '%</div>' +
                    '</div>' +
                '</div>' +
            '</div>';
    }

    ATMChart.initPage();

    window.addEventListener('theme-changed', function() {
        loadData(currentCode);
    });

    ATMPerf.VisibilityManager.register(
        function() {
            if (klineChart) { klineChart.resize(); }
            if (shareDetailChart) { shareDetailChart.resize(); }
        },
        function() {
            setTimeout(function() {
                if (klineChart) klineChart.resize();
                if (shareDetailChart) shareDetailChart.resize();
            }, 200);
        }
    );

    window.addEventListener('beforeunload', function() {
        if (klineChart && !klineChart.isDisposed()) klineChart.dispose();
        if (shareDetailChart && !shareDetailChart.isDisposed()) shareDetailChart.dispose();
    });

    loadData(currentCode);
    window.__atmPageReady();
    
    // Expose for inline onclick attributes
    window.switchETF = switchETF;
    } catch(e) { console.error('ETF page init error:', e); }
    });
    </script>
</body>
</html>
