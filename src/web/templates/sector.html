    <script>
    document.addEventListener('DOMContentLoaded', function() {
    try {

    var allSectors = [];
    var selectedCode = null;
    var compareChart = null;
    var shareCompareChart = null;
    var detailChart = null;
    var shareDetailChart = null;
    async function loadSectors() {
        try {
            var resp = await fetch('/api/sector-etf');
            allSectors = await resp.json();
            // Filter out sectors with no kline data
            allSectors = allSectors.filter(function(s) {
                return s.kline && s.kline.length > 0;
            });
            renderSectorCards();
            try { await ATMChart.load(); } catch(e) { console.warn('ECharts load failed:', e); }
            // Wrap chart renders in try-catch — requestAnimationFrame
            // runs outside the outer try-catch scope, so any throw here
            // would trigger window.onerror and show the ⚠️ warning banner.
            requestAnimationFrame(function() {
                try {
                    if (typeof echarts !== 'undefined') {
                        renderCompareChart();
                        renderShareCompare();
                        renderShareRankTable();
                    } else {
                        console.warn('echarts not available, skipping initial chart render');
                    }
                } catch(e) { console.error('Chart render error:', e); }
            });
            // Auto-select first ETF if no code in URL
            var urlCode = new URLSearchParams(window.location.search).get('code');
            if (urlCode) {
                selectSector(urlCode);
            } else if (allSectors.length > 0) {
                selectSector(allSectors[0].ts_code);
            }
        } catch(e) {
            console.error('加载失败:', e);
            document.getElementById('sector-cards').innerHTML =
                '<div class="glass rounded-lg p-3 text-center" style="grid-column:1/-1;color:var(--c-text-tertiary);">暂无数据，请先运行 fetch_data.py</div>';
        }
    }

    var SIGNAL_STYLE = {
        strong: { bg: 'var(--c-up-bg)', color: 'var(--c-up)', label: '强势' },
        lurk:   { bg: 'var(--c-accent-bg)', color: 'var(--c-accent)', label: '潜伏' },
        exit:   { bg: 'var(--c-down-bg)', color: 'var(--c-down)', label: '撤离' },
        risk:   { bg: 'rgba(255,93,0,0.1)', color: '#ff5d00', label: '风险' },
    };

    function renderSectorCards() {
        var container = document.getElementById('sector-cards');
        // Sort by pct_chg descending (涨幅从高到低)
        var sorted = allSectors.slice().sort(function(a, b) {
            var pa = a.kline && a.kline.length ? parseFloat(a.kline[a.kline.length-1].pct_chg || 0) : 0;
            var pb = b.kline && b.kline.length ? parseFloat(b.kline[b.kline.length-1].pct_chg || 0) : 0;
            return pb - pa;
        });
        // Chip-style layout — compact colored chips, clickable
        container.innerHTML = '<div class="sector-chips">' +
            sorted.map(function(s) {
                var kline = s.kline || [];
                var last = kline.length > 0 ? kline[kline.length - 1] : null;
                var pct = last ? parseFloat(last.pct_chg || 0) : 0;
                var isSelected = selectedCode === s.ts_code;
                var sig = (s.signal && s.signal.tag !== 'none') ? SIGNAL_STYLE[s.signal.tag] : null;
                // Background color: signal-based
                var chipBg = sig ? sig.bg : 'var(--c-bg-tertiary)';
                var chipBorder = sig ? sig.color : 'var(--c-border-light)';
                var selClass = isSelected ? ' chip-selected' : '';
                return '<div class="sector-chip' + selClass + '" style="background:' + chipBg + ';border-color:' + chipBorder + ';" onclick="selectSector(\'' + s.ts_code + '\')">' +
                    '<span class="chip-name">' + s.name + '</span>' +
                    '<span class="chip-pct" style="color:' + ATM.pctColor(pct) + '">' + ATM.pctText(pct) + '</span>' +
                '</div>';
            }).join('') +
            '</div>';
    }

    function selectSector(code) {
        selectedCode = code;
        renderSectorCards();
        var sector = allSectors.find(function(s) { return s.ts_code === code; });
        if (sector) showDetail(sector);
    }

    function showDetail(sector) {
        var section = document.getElementById('detail-section');
        section.classList.remove('hidden');
        document.getElementById('detail-title').textContent = sector.name + ' K线走势';
        document.getElementById('detail-share-title').textContent = sector.name + ' 份额实际值';
        // ── Kline chart rendering ──
        var el = document.getElementById('detail-kline');
        if (detailChart && !detailChart.isDisposed()) detailChart.dispose();
        el.innerHTML = '';
        if (typeof echarts === 'undefined') { console.warn('echarts not available'); return; }
        detailChart = echarts.init(el);
        var kline = sector.kline || [];
        if (kline.length === 0) return;

        var th = ATM.getChartTheme();
        var dates = kline.map(function(k) { return k.trade_date; });
        var ohlc = kline.map(function(k) { return [parseFloat(k.open||0), parseFloat(k.close||0), parseFloat(k.low||0), parseFloat(k.high||0)]; });
        var volumes = kline.map(function(k) { return parseFloat(k.vol || 0); });
        var pcts = kline.map(function(k) { return parseFloat(k.pct_chg || 0); });

        var sortedVols = volumes.slice().sort(function(a, b) { return a - b; });
        var volPercentiles = volumes.map(function(v) {
            if (sortedVols.length === 0) return 0;
            var rank = sortedVols.filter(function(x) { return x <= v; }).length;
            return Math.round(rank / sortedVols.length * 100);
        });

        detailChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            tooltip: {
                backgroundColor: th.tooltip.backgroundColor,
                borderColor: th.tooltip.borderColor,
                textStyle: th.tooltip.textStyle,
                formatter: function(params) {
                    var result = '<b>' + params[0].axisValue + '</b><br/>';
                    params.forEach(function(p) {
                        var val = p.value;
                        if (Array.isArray(val)) {
                            result += p.marker + ' 开盘: ' + val[1].toFixed(2) + ', 收盘: ' + val[2].toFixed(2) + ', 最低: ' + val[3].toFixed(2) + ', 最高: ' + val[4].toFixed(2) + '<br/>';
                        } else {
                            result += p.marker + ' ' + p.seriesName + ': ' + val + '%<br/>';
                        }
                    });
                    return result;
                }
            },
            grid: [
                { left: '8%', right: '3%', top: '5%', height: '55%' },
                { left: '8%', right: '3%', top: '68%', height: '20%' }
            ],
            xAxis: [
                { type: 'category', data: dates, gridIndex: 0, axisLabel: { color: th.axisLabelColor, fontSize: 10 }, boundaryGap: true },
                { type: 'category', data: dates, gridIndex: 1, axisLabel: { show: false }, boundaryGap: true }
            ],
            yAxis: [
                { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: th.splitLineColor } }, axisLabel: { color: th.axisLabelColor } },
                { scale: true, gridIndex: 1, splitLine: { show: false }, axisLabel: { color: th.axisLabelColor, formatter: '{value}%' }, min: 0, max: 100 }
            ],
            dataZoom: [
                { type: 'inside', xAxisIndex: [0, 1], start: 60, end: 100 },
                { type: 'slider', xAxisIndex: [0, 1], start: 60, end: 100 }
            ],
            series: [
                { name: 'K线', type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0,
                  itemStyle: { color: th.upColor, color0: th.downColor, borderColor: th.upColor, borderColor0: th.downColor } },
                { name: '成交量百分位', type: 'bar', xAxisIndex: 1, yAxisIndex: 1,
                  data: volPercentiles.map(function(pct, i) { return { value: pct, itemStyle: { color: pcts[i] >= 0 ? th.upColor + '66' : th.downColor + '66' } }; }),
                  label: { show: true, position: 'top', color: th.axisLabelColor, fontSize: 8, formatter: '{c}%' }
                }
            ]
        }, true);
        renderShareDetail(sector);
    }

    // 份额实际值图表：过去120天折线(绝对值) + 每日变化ZSCORE柱状
    function renderShareDetail(sector) {
        var el = document.getElementById('detail-share-chart');
        if (shareDetailChart && !shareDetailChart.isDisposed()) shareDetailChart.dispose();
        el.innerHTML = '';
        if (typeof echarts === 'undefined') { console.warn('echarts not available'); return; }
        shareDetailChart = echarts.init(el);
        var th = ATM.getChartTheme();

        var shares = (sector.shares || []).slice();
        if (shares.length === 0) {
            shareDetailChart.setOption({
                backgroundColor: 'transparent',
                title: { text: '暂无份额数据', left: 'center', top: 'center', textStyle: { color: th.axisLabelColor, fontSize: 14, fontWeight: 'normal' } }
            }, true);
            return;
        }

        // 取过去120天数据
        var chartData = shares.slice(-120);
        var dates = chartData.map(function(sh) {
            var d = sh.trade_date;
            return d ? d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8) : d;
        });
        var values = chartData.map(function(sh) { return parseFloat(sh.fd_share || 0); });

        // 计算每日变化量: delta[i] = values[i] - values[i-1]
        var dailyChanges = [];
        for (var i = 0; i < values.length; i++) {
            dailyChanges.push(i === 0 ? null : values[i] - values[i-1]);
        }

        // 计算变化量的均值和标准差
        var validChanges = dailyChanges.filter(function(v) { return v !== null; });
        var chgMean = validChanges.reduce(function(a, b) { return a + b; }, 0) / validChanges.length;
        var chgVariance = validChanges.reduce(function(a, b) { return a + Math.pow(b - chgMean, 2); }, 0) / validChanges.length;
        var chgStd = Math.sqrt(chgVariance) || 1;

        // ZSCORE = (每日变化 - 均值) / 标准差
        var zscores = dailyChanges.map(function(v) {
            return v === null ? null : (v - chgMean) / chgStd;
        });

        shareDetailChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            tooltip: {
                trigger: 'axis',
                backgroundColor: th.tooltip.backgroundColor,
                borderColor: th.tooltip.borderColor,
                textStyle: th.tooltip.textStyle,
                formatter: function(params) {
                    var tip = '<b>' + params[0].axisValueLabel + '</b><br/>';
                    params.forEach(function(p) {
                        if (p.value === null || p.value === undefined) return;
                        if (p.seriesName.indexOf('ZSCORE') !== -1) {
                            var zv = p.value;
                            var zcolor = zv > 0 ? th.upColor : zv < 0 ? th.downColor : '#888';
                            tip += p.marker + ' ' + p.seriesName + ': <span style="color:' + zcolor + ';font-weight:bold;">' + (zv > 0 ? '+' : '') + zv.toFixed(2) + 'σ</span><br/>';
                        } else {
                            tip += p.marker + ' ' + p.seriesName + ': ' + p.value.toFixed(2) + ' 亿份<br/>';
                        }
                    });
                    return tip;
                }
            },
            legend: {
                data: ['份额绝对值(120日)', '份额变化ZSCORE'],
                textStyle: th.legend.textStyle
            },
            grid: { left: '8%', right: '8%', top: '15%', bottom: '12%' },
            xAxis: {
                type: 'category',
                data: dates,
                axisLabel: { color: th.axisLabelColor, fontSize: 10, rotate: 30 },
                boundaryGap: true
            },
            yAxis: [
                {
                    type: 'value',
                    name: '亿份',
                    nameTextStyle: { color: th.axisLabelColor, fontSize: 10 },
                    axisLabel: { color: th.axisLabelColor, formatter: '{value}' },
                    splitLine: { lineStyle: { color: th.splitLineColor } }
                },
                {
                    type: 'value',
                    name: 'σ',
                    nameTextStyle: { color: th.axisLabelColor, fontSize: 10 },
                    axisLabel: { color: th.axisLabelColor, formatter: '{value}σ' },
                    splitLine: { show: false },
                    scale: true
                }
            ],
            dataZoom: [
                { type: 'inside', start: 0, end: 100 },
                { type: 'slider', start: 0, end: 100 }
            ],
            series: [
                {
                    name: '份额绝对值(120日)',
                    type: 'line',
                    yAxisIndex: 0,
                    data: values,
                    smooth: true,
                    showSymbol: false,
                    lineStyle: { width: 2, color: '#6B8F71' },
                    areaStyle: {
                        color: {
                            type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: '#6B8F7144' },
                                { offset: 1, color: '#6B8F7108' }
                            ]
                        }
                    },
                    z: 1
                },
                {
                    name: '份额变化ZSCORE',
                    type: 'bar',
                    yAxisIndex: 1,
                    data: zscores.map(function(z) {
                        if (z === null) return { value: null };
                        return {
                            value: z,
                            itemStyle: {
                                color: z >= 0 ? th.upColor : th.downColor,
                                opacity: 0.7
                            }
                        };
                    }),
                    barMaxWidth: 12,
                    z: 2
                }
            ]
        }, true);
        
    }

    // renderFinancialQuality removed — F_Quality display removed from sector page

    function renderCompareChart() {
        var el = document.getElementById('compare-chart');
        if (compareChart && !compareChart.isDisposed()) compareChart.dispose();
        el.innerHTML = '';
        if (typeof echarts === 'undefined') { console.warn('echarts not available'); return; }
        compareChart = echarts.init(el);
        var th = ATM.getChartTheme();

        var with20d = allSectors.map(function(s) {
            var kline = s.kline || [];
            var p20 = 0;
            if (kline.length >= 20) {
                p20 = (parseFloat(kline[kline.length-1].close) - parseFloat(kline[kline.length-21].close))
                       / parseFloat(kline[kline.length-21].close) * 100;
            }
            return { name: s.name, kline: kline, _p20: p20 };
        }).sort(function(a, b) { return b._p20 - a._p20; });

        var series5 = [], series10 = [], series20 = [], names = [];
        with20d.forEach(function(s) {
            var kline = s.kline;
            var shortName = s.name.replace('ETF', '').replace('etf', '');
            names.push(shortName);
            if (kline.length >= 5) {
                var p5 = (parseFloat(kline[kline.length-1].close) - parseFloat(kline[kline.length-6].close))
                          / parseFloat(kline[kline.length-6].close) * 100;
                series5.push(p5.toFixed(2));
            } else series5.push(0);
            if (kline.length >= 10) {
                var p10 = (parseFloat(kline[kline.length-1].close) - parseFloat(kline[kline.length-11].close))
                           / parseFloat(kline[kline.length-11].close) * 100;
                series10.push(p10.toFixed(2));
            } else series10.push(0);
            series20.push(s._p20.toFixed(2));
        });

        compareChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            tooltip: { trigger: 'axis', backgroundColor: th.tooltip.backgroundColor, borderColor: th.tooltip.borderColor, textStyle: th.tooltip.textStyle },
            legend: { data: ['5日', '10日', '20日'], textStyle: th.legend.textStyle },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'category', data: names, axisLabel: { color: th.axisLabelColor, rotate: 30, fontSize: 10 } },
            yAxis: { type: 'value', axisLabel: { color: th.axisLabelColor, formatter: '{value}%' }, splitLine: { lineStyle: { color: th.splitLineColor } } },
            series: [
                { name: '5日', type: 'bar', data: series5, itemStyle: { color: '#6B8F71' }, barMaxWidth: 15 },
                { name: '10日', type: 'bar', data: series10, itemStyle: { color: '#8FBF97' }, barMaxWidth: 15 },
                { name: '20日', type: 'bar', data: series20, itemStyle: { color: '#4A7050' }, barMaxWidth: 15 }
            ]
        }, true);
    }

    function renderShareCompare() {
        var el = document.getElementById('share-compare-chart');
        if (shareCompareChart && !shareCompareChart.isDisposed()) shareCompareChart.dispose();
        el.innerHTML = '';
        if (typeof echarts === 'undefined') { console.warn('echarts not available'); return; }
        shareCompareChart = echarts.init(el);
        var th = ATM.getChartTheme();

        var seriesList = allSectors.map(function(s) {
            var shares = (s.shares || []).slice(-16);
            var vals = shares.map(function(sh) { return parseFloat(sh.fd_share || 0); });
            var mean = vals.reduce(function(a, b) { return a + b; }, 0) / vals.length;
            var std = Math.sqrt(vals.reduce(function(a, b) { return a + Math.pow(b - mean, 2); }, 0) / vals.length) || 1;
            return {
                name: s.name, type: 'line',
                data: shares.map(function(sh, i) {
                    var d = sh.trade_date;
                    var fmt = d ? d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8) : d;
                    return [fmt, parseFloat(((vals[i] - mean) / std).toFixed(2))];
                }),
                smooth: true, showSymbol: false,
                lineStyle: { width: 1.5 },
                emphasis: { lineStyle: { width: 3 } }
            };
        });

        if (seriesList.length === 0 || seriesList.every(function(s) { return s.data.length === 0; })) {
            shareCompareChart.setOption({
                backgroundColor: 'transparent',
                title: { text: '暂无份额数据', left: 'center', top: 'center', textStyle: { color: th.axisLabelColor, fontSize: 14, fontWeight: 'normal' } }
            }, true);
            return;
        }

        shareCompareChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            tooltip: { trigger: 'axis', backgroundColor: th.tooltip.backgroundColor, borderColor: th.tooltip.borderColor, textStyle: th.tooltip.textStyle,
                formatter: function(params) {
                    var date = params[0] ? params[0].axisValueLabel : '';
                    var tip = date + '<br/>';
                    params.sort(function(a, b) { var va = Array.isArray(a.value) ? a.value[1] : a.value; var vb = Array.isArray(b.value) ? b.value[1] : b.value; return vb - va; });
                    params.forEach(function(p) {
                        var v = Array.isArray(p.value) ? p.value[1] : p.value;
                        var color = v > 0 ? th.upColor : v < 0 ? th.downColor : th.axisLabelColor;
                        tip += p.marker + ' <span style="color:' + color + '">' + p.seriesName + ': ' + (v > 0 ? '+' : '') + (typeof v === 'number' ? v.toFixed(2) : v) + 'σ</span><br/>';
                    });
                    return tip;
                }
            },
            legend: { type: 'scroll', textStyle: { color: th.legend.textStyle.color, fontSize: 10 } },
            grid: { left: '10%', right: '3%', top: '15%', bottom: '10%' },
            xAxis: { type: 'time', axisLabel: { color: th.axisLabelColor } },
            yAxis: { type: 'value', axisLabel: { color: th.axisLabelColor, formatter: '{value}σ' }, splitLine: { lineStyle: { color: th.splitLineColor } } },
            dataZoom: [{ type: 'inside' }],
            series: seriesList
        }, true);
    }

    function renderShareRankTable() {
        var el = document.getElementById('share-rank-table');
        
        var rankData = allSectors.map(function(s) {
            var shares = s.shares || [];
            if (shares.length < 2) return null;
            
            var values = shares.map(function(sh) { return parseFloat(sh.fd_share || 0); });
            
            var pctChanges = [];
            for (var i = 1; i < values.length; i++) {
                if (values[i-1] > 0) {
                    pctChanges.push((values[i] - values[i-1]) / values[i-1] * 100);
                }
            }
            
            if (pctChanges.length < 10) return null;
            
            var mean = pctChanges.reduce(function(a, b) { return a + b; }, 0) / pctChanges.length;
            var variance = pctChanges.reduce(function(a, b) { return a + Math.pow(b - mean, 2); }, 0) / pctChanges.length;
            var std = Math.sqrt(variance) || 1;
            
            var latestChange = pctChanges[pctChanges.length - 1];
            var zScore = (latestChange - mean) / std;
            
            var recentChanges = pctChanges.slice(-5);
            var trendSum = recentChanges.reduce(function(a, b) { return a + b; }, 0);
            var trend = trendSum > 0 ? 1 : (trendSum < 0 ? -1 : 0);
            
            var kline = s.kline || [];
            var latestVol = kline.length > 0 ? parseFloat(kline[kline.length-1].vol || 0) : 0;
            var avgVol = kline.length > 5 ? kline.slice(-5).reduce(function(a, k) { return a + parseFloat(k.vol || 0); }, 0) / 5 : latestVol;
            var volRatio = avgVol > 0 ? latestVol / avgVol : 1;
            
            var judgment = '';
            var judgmentColor = '';
            var judgmentBg = '';
            
            if (zScore > 1.5 && trend > 0) {
                if (volRatio > 1.2) {
                    judgment = '强势流入';
                    judgmentColor = '#059669';
                    judgmentBg = '#ecfdf5';
                } else {
                    judgment = '持续流入';
                    judgmentColor = '#10b981';
                    judgmentBg = '#d1fae5';
                }
            } else if (zScore > 0.5 && trend > 0) {
                judgment = '温和流入';
                judgmentColor = '#0ea5e9';
                judgmentBg = '#f0f9ff';
            } else if (zScore < -1.5 && trend < 0) {
                if (volRatio > 1.2) {
                    judgment = '强势流出';
                    judgmentColor = '#dc2626';
                    judgmentBg = '#fef2f2';
                } else {
                    judgment = '持续流出';
                    judgmentColor = '#ef4444';
                    judgmentBg = '#fee2e2';
                }
            } else if (zScore < -0.5 && trend < 0) {
                judgment = '温和流出';
                judgmentColor = '#f97316';
                judgmentBg = '#fff7ed';
            } else if (zScore > 0.5 && trend < 0) {
                judgment = '分歧加大';
                judgmentColor = '#8b5cf6';
                judgmentBg = '#f5f3ff';
            } else if (zScore < -0.5 && trend > 0) {
                judgment = '企稳回升';
                judgmentColor = '#06b6d4';
                judgmentBg = '#ecfeff';
            } else {
                judgment = '震荡整理';
                judgmentColor = '#6b7280';
                judgmentBg = '#f9fafb';
            }
            
            return {
                name: s.name,
                ts_code: s.ts_code,
                zScore: zScore,
                latestChange: latestChange,
                std: std,
                judgment: judgment,
                judgmentColor: judgmentColor,
                judgmentBg: judgmentBg,
                trend: trend
            };
        }).filter(function(d) { return d !== null; }).sort(function(a, b) { return b.zScore - a.zScore; });
        
        if (rankData.length === 0) {
            el.innerHTML = '<div style="color:var(--c-text-tertiary);text-align:center;padding:1rem;">暂无份额数据</div>';
            return;
        }
        
        var html = '<div class="table-scroll"><table class="w-full text-sm">';
        html += '<thead><tr style="background:var(--c-bg-secondary);">';
        html += '<th class="px-3 py-2 text-left">排名</th>';
        html += '<th class="px-3 py-2 text-left">ETF名称</th>';
        html += '<th class="px-3 py-2 text-center">最新变化</th>';
        html += '<th class="px-3 py-2 text-center">标准差</th>';
        html += '<th class="px-3 py-2 text-center">ZScore</th>';
        html += '<th class="px-3 py-2 text-center">趋势判断</th>';
        html += '</tr></thead><tbody>';
        
        rankData.forEach(function(d, i) {
            var zScoreColor = d.zScore > 0 ? 'var(--c-up)' : (d.zScore < 0 ? 'var(--c-down)' : '#888');
            var changeColor = d.latestChange > 0 ? 'var(--c-up)' : (d.latestChange < 0 ? 'var(--c-down)' : '#888');
            html += '<tr class="border-t" style="border-color:var(--c-border);">';
            html += '<td class="px-3 py-2 font-bold" style="color:var(--c-accent);">' + (i + 1) + '</td>';
            html += '<td class="px-3 py-2">' + d.name + '</td>';
            html += '<td class="px-3 py-2 text-center font-mono" style="color:' + changeColor + ';">' + (d.latestChange > 0 ? '+' : '') + d.latestChange.toFixed(4) + '%</td>';
            html += '<td class="px-3 py-2 text-center font-mono" style="color:#888;">' + d.std.toFixed(4) + '%</td>';
            html += '<td class="px-3 py-2 text-center font-mono font-bold" style="color:' + zScoreColor + ';">' + (d.zScore > 0 ? '+' : '') + d.zScore.toFixed(2) + 'σ</td>';
            html += '<td class="px-3 py-2 text-center"><span class="px-2 py-1 rounded text-xs font-medium" style="background:' + d.judgmentBg + ';color:' + d.judgmentColor + ';">' + d.judgment + '</span></td>';
            html += '</tr>';
        });
        
        html += '</tbody></table></div>';
        el.innerHTML = html;
    }

    ATMChart.initPage();

    window.addEventListener('theme-changed', function() {
        loadSectors();
    });

    ATMPerf.VisibilityManager.register(
        function() {},
        function() {
            setTimeout(function() { ATMChart.resizeAll(); }, 200);
        }
    );

    window.addEventListener('beforeunload', function() {
        if (compareChart && !compareChart.isDisposed()) compareChart.dispose();
        if (shareCompareChart && !shareCompareChart.isDisposed()) shareCompareChart.dispose();
        if (detailChart && !detailChart.isDisposed()) detailChart.dispose();
        if (shareDetailChart && !shareDetailChart.isDisposed()) shareDetailChart.dispose();
    });

    loadSectors();
    window.__atmPageReady();
    
    // Expose for JS-generated onclick handlers
    window.selectSector = selectSector;
    } catch(e) { console.error('Sector page init error:', e); }
    });
    </script>
</body>
</html>
