<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个股数据 - ATMstockMarket</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens-wiki.css">
    <link rel="stylesheet" href="/static/css/style-wiki.css">
    <link rel="stylesheet" href="/static/css/components-wiki.css">
    <script src="/static/js/error-handler.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="/static/js/tailwind-config.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/cache.js"></script>
    <script src="/static/js/perf.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"
            onerror="console.warn('ECharts CDN failed; charts will be unavailable')"></script>
    <script src="/static/js/chart-loader.js"></script>
    <script>
        document.documentElement.dataset.theme = 'light';
    </script>
</head>
<body class="min-h-screen">
    <div id="nav-container"></div>

    <div class="sticky top-0 z-[100] py-2.5 sm:py-3 border-b" style="background:var(--c-card);border-color:var(--c-border);">
        <div class="max-w-7xl mx-auto px-4 sm:px-6" style="z-index:100;">
            <div class="relative">
                <input id="stock-search" type="text" autocomplete="off"
                    placeholder="搜索其他股票（名称 / 代码 / 拼音首字母）"
                    class="w-full px-4 py-2.5 rounded-lg border outline-none text-sm transition-colors"
                    style="background:var(--c-input-bg);border-color:var(--c-input-border);"
                    onfocus="this.style.borderColor='var(--c-input-focus-border)';this.style.boxShadow='0 0 0 3px var(--c-input-focus-ring)';if(typeof onSearch==='function'){onSearch(this.value)}"
                    onblur="this.style.borderColor='var(--c-input-border)';this.style.boxShadow='none'"
                    oninput="if(typeof onSearch==='function'){onSearch(this.value)}"
                    onkeydown="if(typeof onSearchKeydown==='function'){onSearchKeydown(event)}">
                <div id="search-dropdown" class="absolute left-0 right-0 top-full mt-1 border rounded-lg shadow-lg max-h-72 overflow-y-auto hidden" style="background:var(--c-card);border-color:var(--c-border);z-index:200;box-shadow:var(--shadow-lg);"></div>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6 stagger-children">

        <div id="loading-bar" class="hidden">
            <div class="text-sm mb-2" id="loading-text" style="color:var(--c-muted);"><span class="spinner inline-block mr-2"></span>正在整合数据...</div>
            <div class="progress-bar-track">
                <div id="loading-fill" class="progress-bar-fill running" style="width:0%"></div>
            </div>
        </div>

        <div id="stock-header" class="hidden glass rounded-xl p-4 sm:p-6">
            <div class="flex items-center justify-between flex-wrap gap-3">
                <div>
                    <span id="stock-name" class="text-xl sm:text-2xl font-bold"></span>
                    <span id="stock-code" class="text-sm ml-2" style="color:var(--c-muted);"></span>
                    <span id="stock-industry" class="text-xs ml-2 px-2 py-0.5 rounded-full" style="background:var(--c-accent-bg);color:var(--c-accent);"></span>
                </div>
                <div class="flex gap-3 sm:gap-6 text-sm">
                    <div><span style="color:var(--c-muted);">最新价</span> <span id="hdr-price" class="text-lg sm:text-xl font-bold ml-1 num-mono font-mono">--</span></div>
                    <div><span style="color:var(--c-muted);">涨跌幅</span> <span id="hdr-pct" class="text-lg sm:text-xl font-bold ml-1 num-mono font-mono">--</span></div>
                    <div><span style="color:var(--c-muted);">成交量</span> <span id="hdr-vol" class="text-lg sm:text-xl font-bold ml-1 num-mono font-mono">--</span></div>
                </div>
            </div>
        </div>

        <div id="chart-section" class="hidden glass rounded-xl p-4 sm:p-6">
            <h3 class="font-bold mb-3 flex items-center gap-2">
                <span class="w-1 h-5 rounded" style="background:var(--c-accent);"></span>
                K线 · 布林带 · 成交量 · MACD
                <span class="text-xs" style="color:var(--c-muted);">（近60个交易日）</span>
            </h3>
            <div id="main-chart" class="chart-main" style="height: 560px; min-height: 280px;"></div>
        </div>

        <div id="fundamental-section" class="hidden glass rounded-xl p-4 sm:p-6">
            <h3 class="font-bold mb-4 flex items-center gap-2">
                <span class="w-1 h-5 rounded" style="background:var(--c-accent);"></span>
                基本面指标
            </h3>
            <div id="funda-cards" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3 stagger-children"></div>
        </div>

        <div id="quadrant-section" class="hidden glass rounded-xl p-4 sm:p-6">
            <h3 class="font-bold mb-3 flex items-center gap-2">
                <span class="w-1 h-5 rounded" style="background:var(--c-accent);"></span>
                ROE vs PE 四象限
                <span id="quadrant-label" class="text-xs" style="color:var(--c-muted);"></span>
            </h3>
            <div id="quadrant-chart" class="chart-quadrant" style="height: 340px;"></div>
        </div>
    </main>

    <footer class="text-center text-xs py-6 border-t mt-12" style="color:var(--c-muted);border-color:var(--c-border);">
        ATMstockMarket &mdash; 数据来源: Tushare | 仅供学习研究，不构成投资建议
    </footer>

    <script>
    try {
    ATMNav.insert('nav-container', 'stock');

    var mainChart = null;
    var quadrantChart = null;
    var currentCode = window.location.pathname.split('/').pop();

    // Inline script runs after DOM is already parsed, so call loadStock directly.
    if (currentCode && currentCode.length > 0) {
        loadStock(currentCode);
    } else {
        document.getElementById('stock-search').focus();
    }

    async function loadStock(code) {
        var bar = document.getElementById('loading-bar');
        var fill = document.getElementById('loading-fill');
        bar.classList.remove('hidden');
        fill.style.width = '20%';
        document.getElementById('loading-text').innerHTML = '<span class="spinner inline-block mr-2"></span>正在获取 ' + code + ' 数据...';

        ['stock-header','chart-section','fundamental-section','quadrant-section'].forEach(function(id) {
            document.getElementById(id).classList.add('hidden');
        });

        try {
            fill.style.width = '50%';
            var resp = await fetch('/api/stock/' + code);
            var data = await resp.json();
            if (data.error) {
                document.getElementById('loading-text').innerHTML = '<span class="spinner inline-block mr-2"></span>' + data.error;
                fill.style.width = '100%';
                fill.className = 'progress-bar-fill error';
                return;
            }
            fill.style.width = '80%';
            document.getElementById('loading-text').innerHTML = '<span class="spinner inline-block mr-2"></span>正在绘制图表...';
            try { await ATMChart.load(); } catch(e) { console.warn('ECharts load failed:', e); }
            renderAll(data);
            fill.style.width = '100%';
            fill.className = 'progress-bar-fill done';
            setTimeout(function() { bar.classList.add('hidden'); }, 600);

            if (code !== currentCode) {
                history.pushState(null, '', '/stock/' + code);
            }
            document.title = data.name + ' - ATMstockMarket';
        } catch(e) {
            document.getElementById('loading-text').innerHTML = '<span class="spinner inline-block mr-2"></span>加载失败: ' + e.message;
            fill.style.width = '100%';
            fill.className = 'progress-bar-fill error';
        }
    }

    function renderAll(data) {
        renderHeader(data);
        renderFundamentals(data);
        ['stock-header','chart-section','fundamental-section','quadrant-section'].forEach(function(id) {
            document.getElementById(id).classList.remove('hidden');
        });
        renderMainChart(data);
        renderQuadrant(data);
    }

    function renderHeader(data) {
        document.getElementById('stock-name').textContent = data.name;
        document.getElementById('stock-code').textContent = data.ts_code;
        document.getElementById('stock-industry').textContent = data.industry || '';
        var kline = data.kline || [];
        if (kline.length > 0) {
            var last = kline[kline.length - 1];
            document.getElementById('hdr-price').textContent = ATM.formatNum(last.close);
            var pct = parseFloat(last.pct_chg || 0);
            var pctEl = document.getElementById('hdr-pct');
            pctEl.textContent = ATM.pctText(pct);
            pctEl.style.color = ATM.pctColor(pct);
            document.getElementById('hdr-vol').textContent = ATM.formatNum((parseFloat(last.vol||0)/10000).toFixed(0),0)+'万手';
        }
    }

    function renderMainChart(data) {
        var el = document.getElementById('main-chart');
        if (mainChart && !mainChart.isDisposed()) mainChart.dispose();
        el.innerHTML = '';
        mainChart = echarts.init(el);
        var kline = data.kline || [];
        if (kline.length === 0) return;

        var th = ATM.getChartTheme();
        var dates = kline.map(function(k) { return k.trade_date; });
        var ohlc = kline.map(function(k) { return [+k.open, +k.close, +k.low, +k.high]; });
        var vols = kline.map(function(k) { return +k.vol; });
        var pcts = kline.map(function(k) { return +k.pct_chg; });
        var bol = data.bollinger || {};
        var dif = data.dif || [];
        var dea = data.dea || [];
        var macdBar = data.macd_bar || [];
        var volPct = data.vol_pct || [];

        mainChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            tooltip: th.tooltip,
            legend: { data: ['K线','BOLL上轨','BOLL中轨','BOLL下轨','成交量','DIF','DEA','MACD'],
                textStyle: { color: th.axisLabelColor, fontSize: 10 }, top: 0 },
            grid: [
                { left: '8%', right: '3%', top: '8%', height: '42%' },
                { left: '8%', right: '3%', top: '55%', height: '14%' },
                { left: '8%', right: '3%', top: '74%', height: '12%' }
            ],
            xAxis: [
                { type: 'category', data: dates, gridIndex: 0, axisLabel: { show: false }, boundaryGap: true },
                { type: 'category', data: dates, gridIndex: 1, axisLabel: { show: false }, boundaryGap: true },
                { type: 'category', data: dates, gridIndex: 2, axisLabel: { color: th.axisLabelColor, fontSize: 10 }, boundaryGap: true }
            ],
            yAxis: [
                { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: th.splitLineColor } }, axisLabel: { color: th.axisLabelColor } },
                { scale: true, gridIndex: 1, splitLine: { show: false }, axisLabel: { color: th.axisLabelColor } },
                { scale: true, gridIndex: 2, splitLine: { show: false }, axisLabel: { color: th.axisLabelColor } }
            ],
            dataZoom: [
                { type: 'inside', xAxisIndex: [0,1,2], start: 0, end: 100 },
                { show: true, xAxisIndex: [0,1,2], type: 'slider', bottom: '2%', start: 0, end: 100 }
            ],
            series: [
                { name: 'K线', type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0,
                  itemStyle: { color: th.upColor, color0: th.downColor, borderColor: th.upColor, borderColor0: th.downColor } },
                { name: 'BOLL上轨', type: 'line', data: bol.upper, xAxisIndex: 0, yAxisIndex: 0,
                  symbol: 'none', lineStyle: { color: 'rgba(49,130,206,0.5)', width: 1, type: 'dashed' } },
                { name: 'BOLL中轨', type: 'line', data: bol.sma, xAxisIndex: 0, yAxisIndex: 0,
                  symbol: 'none', lineStyle: { color: '#D69E2E', width: 1.5 } },
                { name: 'BOLL下轨', type: 'line', data: bol.lower, xAxisIndex: 0, yAxisIndex: 0,
                  symbol: 'none', lineStyle: { color: 'rgba(49,130,206,0.5)', width: 1, type: 'dashed' },
                  areaStyle: { color: 'rgba(49,130,206,0.04)', origin: 'auto' } },
                { name: '成交量', type: 'bar', data: vols.map(function(v,i) {
                    var pct = volPct[i];
                    var show = pct !== null && (pct > 80 || pct < 20);
                    var pctClr = pct !== null ? (pct > 80 ? th.upColor : pct < 20 ? th.downColor : th.axisLabelColor) : 'transparent';
                    return {
                        value: v,
                        itemStyle: { color: pcts[i] >= 0 ? th.upColor + '66' : th.downColor + '66' },
                        label: show ? { show: true, position: 'top', fontSize: 8, color: pctClr, formatter: pct.toFixed(0)+'%', distance: 2 } : { show: false }
                    };
                }), xAxisIndex: 1, yAxisIndex: 1 },
                { name: 'DIF', type: 'line', data: dif, xAxisIndex: 2, yAxisIndex: 2,
                  symbol: 'none', lineStyle: { color: th.upColor, width: 1.5 } },
                { name: 'DEA', type: 'line', data: dea, xAxisIndex: 2, yAxisIndex: 2,
                  symbol: 'none', lineStyle: { color: th.downColor, width: 1.5 } },
                { name: 'MACD', type: 'bar', data: macdBar.map(function(v) { return v !== null ? {
                    value: v, itemStyle: { color: v >= 0 ? th.upColor + '99' : th.downColor + '99' }
                } : null; }), xAxisIndex: 2, yAxisIndex: 2 }
            ]
        }, true);
    }

    function renderFundamentals(data) {
        var v = data.valuation || {};
        var f = data.financials || {};
        var mv = v.total_mv ? (parseFloat(v.total_mv)/10000).toFixed(1) : '--';
        var items = [
            { label: 'PE(TTM)', value: ATM.formatNum(v.pe_ttm) },
            { label: 'PB', value: ATM.formatNum(v.pb) },
            { label: '市值', value: mv+'亿' },
            { label: 'ROE', value: ATM.formatNum(f.roe)+'%' },
            { label: '营收增速', value: ATM.pctText(f.tr_yoy), color: ATM.pctColor(parseFloat(f.tr_yoy||0)) },
            { label: '净利增速', value: ATM.pctText(f.netprofit_yoy), color: ATM.pctColor(parseFloat(f.netprofit_yoy||0)) },
            { label: '毛利率', value: ATM.formatNum(f.grossprofit_margin)+'%' },
            { label: 'EPS', value: ATM.formatNum(f.eps) },
            { label: '换手率', value: ATM.formatNum(v.turnover_rate)+'%' },
            { label: '报告期', value: f.end_date ? '<span class="pulse-dot"></span> ' + f.end_date : '--', isHtml: true }
        ];
        document.getElementById('funda-cards').innerHTML = items.map(function(it) {
            return '<div class="rounded-lg p-3 text-center" style="background:var(--c-bg-secondary);">' +
                '<div class="text-xs mb-1" style="color:var(--c-muted);">' + it.label + '</div>' +
                '<div class="text-lg font-bold num-mono font-mono" style="' + (it.color ? 'color:'+it.color : '') + '">' + it.value + '</div></div>';
        }).join('');
    }

    function renderQuadrant(data) {
        var q = data.quadrant || {};
        var stocks = q.stocks || [];
        var cur = q.current;
        document.getElementById('quadrant-label').textContent =
            data.industry ? '（' + data.industry + '行业，共' + stocks.length + '只）' : '';
        if (stocks.length === 0) return;

        var el = document.getElementById('quadrant-chart');
        if (quadrantChart && !quadrantChart.isDisposed()) quadrantChart.dispose();
        el.innerHTML = '';
        quadrantChart = echarts.init(el);
        var th = ATM.getChartTheme();

        var curInList = stocks.find(function(s) { return s.ts_code === data.ts_code; });
        var curPE = curInList ? parseFloat(curInList.pe_ttm) : (cur ? parseFloat(cur.pe_ttm) : 0);
        var curROE = curInList ? parseFloat(curInList.roe) : (cur ? parseFloat(cur.roe) : 0);

        var filtered = stocks;
        var allPes = stocks.map(function(s) { return parseFloat(s.pe_ttm)||0; }).filter(function(p) { return p > 0; });
        if (allPes.length > 5) {
            var sorted = allPes.slice().sort(function(a,b) { return a-b; });
            var median = sorted[Math.floor(sorted.length/2)];
            var cap = median * 4;
            filtered = stocks.filter(function(s) { return (parseFloat(s.pe_ttm)||0) <= cap; });
        }

        var pes = filtered.map(function(s) { return parseFloat(s.pe_ttm)||0; });
        var roes = filtered.map(function(s) { return parseFloat(s.roe)||0; });
        var peMid = pes.length ? (Math.max.apply(null, pes)+Math.min.apply(null, pes))/2 : 0;
        var roeMid = roes.length ? (Math.max.apply(null, roes)+Math.min.apply(null, roes))/2 : 0;

        quadrantChart.setOption({
            backgroundColor: 'transparent',
            textStyle: th.textStyle,
            tooltip: { backgroundColor: th.tooltip.backgroundColor, borderColor: th.tooltip.borderColor, textStyle: th.tooltip.textStyle,
                formatter: function(p) {
                    var v = Array.isArray(p.data) ? p.data : (p.data.value || p.data);
                    return '<b>' + (v[2]||'') + '</b><br/>PE: ' + parseFloat(v[0]).toFixed(1) + '<br/>ROE: ' + parseFloat(v[1]).toFixed(1) + '%';
                }
            },
            grid: { left: '10%', right: '15%', bottom: '12%', top: '8%', containLabel: true },
            xAxis: { name: 'PE(TTM)', type: 'value', nameLocation: 'center', nameGap: 30,
                axisLabel: { color: th.axisLabelColor }, splitLine: { lineStyle: { color: th.splitLineColor } } },
            yAxis: { name: 'ROE(%)', type: 'value', nameLocation: 'center', nameGap: 45,
                axisLabel: { color: th.axisLabelColor }, splitLine: { lineStyle: { color: th.splitLineColor } } },
            series: [{
                type: 'scatter', symbolSize: 7,
                itemStyle: { color: th.accentColor },
                data: filtered.map(function(s) { return [parseFloat(s.pe_ttm)||0, parseFloat(s.roe)||0, s.name]; }),
                markLine: { silent: true, lineStyle: { color: th.splitLineColor, type: 'dashed', width: 1 },
                    label: { show: false }, data: [{ xAxis: peMid }, { yAxis: roeMid }] },
                markPoint: {
                    symbol: 'pin', symbolSize: 50,
                    label: { show: true, fontSize: 10, fontWeight: 'bold', color: '#fff' },
                    itemStyle: { color: th.upColor },
                    data: [{ coord: [curPE, curROE], value: data.name, name: data.name }]
                }
            }]
        }, true);
    }

    var _searchTimer = null;
    function onSearch(q) {
        clearTimeout(_searchTimer);
        var dd = document.getElementById('search-dropdown');
        if (!q || q.trim().length < 1) { dd.classList.add('hidden'); return; }
        _searchTimer = setTimeout(async function() {
            try {
                var resp = await fetch('/api/search?q=' + encodeURIComponent(q.trim()));
                var results = await resp.json();
                if (!results || results.length === 0) {
                    dd.innerHTML = '<div class="px-4 py-3 text-sm" style="color:var(--c-muted);">未找到匹配股票</div>';
                } else {
                    dd.innerHTML = results.map(function(s) {
                        var score = parseInt(s.score) || 0;
                        var typeLabel = score >= 100 ? '代码' : score >= 80 ? '名称' : score >= 60 ? '拼音' : '模糊';
                        var typeColor = score >= 100 ? 'var(--c-accent)' : score >= 80 ? 'var(--c-down)' : 'var(--c-muted)';
                        return '<div class="flex items-center justify-between px-4 py-2.5 text-sm cursor-pointer" style="color:var(--c-text);" onclick="selectStock(\'' + ATM.escapeHtml(s.ts_code) + '\')">' +
                            '<div><span class="font-semibold">' + ATM.escapeHtml(s.name) + '</span> <span class="text-xs ml-2" style="color:var(--c-muted);">' + ATM.escapeHtml(s.ts_code) + '</span></div>' +
                            '<div class="flex items-center gap-2">' +
                                '<span class="text-xs px-1.5 py-0.5 rounded-full" style="color:' + typeColor + ';background:' + typeColor + '16;font-size:10px;">' + typeLabel + '</span>' +
                                '<span class="text-xs" style="color:var(--c-muted);">' + ATM.escapeHtml(s.industry||'') + '</span>' +
                            '</div></div>';
                    }).join('');
                }
                dd.classList.remove('hidden');
            } catch(e) { console.error(e); }
        }, 200);
    }

    function selectStock(code) {
        document.getElementById('search-dropdown').classList.add('hidden');
        document.getElementById('stock-search').value = '';
        loadStock(code);
    }

    function onSearchKeydown(e) {
        if (e.key === 'Enter') {
            var dd = document.getElementById('search-dropdown');
            var firstItem = dd.querySelector('[onclick^="selectStock"]');
            if (firstItem) {
                e.preventDefault();
                firstItem.click();
            }
        }
    }

    document.addEventListener('click', function(e) {
        var box = document.getElementById('stock-search');
        var dd = document.getElementById('search-dropdown');
        if (box && dd && !box.contains(e.target) && !dd.contains(e.target)) { dd.classList.add('hidden'); }
    });

    ATMChart.initPage();

    window.addEventListener('theme-changed', function() {
        if (currentCode) loadStock(currentCode);
    });

    ATMPerf.VisibilityManager.register(
        function() {},
        function() {
            setTimeout(function() { ATMChart.resizeAll(); }, 200);
        }
    );

    window.addEventListener('beforeunload', function() {
        if (mainChart && !mainChart.isDisposed()) mainChart.dispose();
        if (quadrantChart && !quadrantChart.isDisposed()) quadrantChart.dispose();
    });
    window.__atmPageReady();
    } catch(e) { console.error('Stock detail page init error:', e); }
    </script>
</body>
</html>
