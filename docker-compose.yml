services:
  app:
    build: .
    container_name: atmstockmarket
    ports:
      - "${APP_PORT:-5656}:5656"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/atm_stock_market}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - atm_network
      # - docker_network  # 跨项目通信：需先 `docker network create docker_network` 再取消注释
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    container_name: atmstockmarket-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-atm_stock_market}
      - TZ=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atm_stock_market}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - atm_network

  redis:
    image: redis:7-alpine
    container_name: atmstockmarket-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atm_network

volumes:
  pgdata:
    driver: local

networks:
  atm_network:
    driver: bridge
  # docker_network:        # 默认不启用，避免全新机器部署时因外部网络不存在而失败。
  #   external: true       # 如需与本机其它 compose 项目共享网络，先执行
                          # `docker network create docker_network`，再在 app 服务中取消注释 docker_network。
