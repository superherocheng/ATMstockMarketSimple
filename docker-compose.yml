services:
  app:
    build: .
    container_name: atmstockmarket
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/atm_stock_market}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - docker_network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    container_name: atmstockmarket-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-atm_stock_market}
    # ports:
    #   - "5432:5432"  # Commented: host port 5432 conflict with local PG
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atm_stock_market}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docker_network

volumes:
  pgdata:
    driver: local

networks:
  docker_network:
    external: true